name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bill_maker
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: bill_maker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bill_maker -d bill_maker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://bill_maker:ci-test-password@localhost:5432/bill_maker_test
      TEST_DATABASE_URL: postgresql://bill_maker:ci-test-password@localhost:5432/bill_maker_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      SCHEDULER_ENABLED: "false"
      STORAGE_BACKEND: local
      UPLOAD_DIR: ./uploads
      DODO_PAYMENTS_ENVIRONMENT: test_mode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libffi-dev shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create CI-only .env
        # Throwaway dummy values so compose can resolve variables; no real secrets in CI.
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=test
          APP_BASE_URL=http://localhost:5173
          CORS_ORIGINS=http://localhost:5173
          POSTGRES_USER=bill_maker
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=bill_maker
          SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789
          SCHEDULER_ENABLED=false
          STORAGE_BACKEND=local
          DODO_PAYMENTS_ENVIRONMENT=test_mode
          VITE_API_URL=http://localhost:8000
          EOF

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      - name: Build images
        run: docker compose build
