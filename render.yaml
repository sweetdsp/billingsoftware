# Render Blueprint for Bill Maker: Postgres + Docker API + static frontend.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo and the `main` branch.
# Render asks for every variable marked `sync: false` (secrets are never stored in git).
#
# URLs: the service names below give https://bill-maker-api.onrender.com and
# https://bill-maker-web.onrender.com. If Render says a name is taken it adds a suffix; then
# update APP_BASE_URL / CORS_ORIGINS on the API and VITE_API_URL on the web service to match
# and redeploy the web service (VITE_API_URL is baked in at build time).
#
# Free-tier caveats (fine for user testing, not for production):
#   * web services sleep after ~15 min idle (first request is slow) and the daily scheduler
#     only runs while the service is awake; use "Generate bill now" on a plan instead
#   * the free Postgres expires after 30 days
#   * the disk is ephemeral: uploaded logos are lost on restart (bill PDFs are rebuilt on demand)

databases:
  - name: bill-maker-db
    plan: free
    databaseName: bill_maker
    user: bill_maker

services:
  # ---------------------------------------------------------------- API (FastAPI)
  - type: web
    name: bill-maker-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000" # the Dockerfile's uvicorn listens on 8000
      - key: RUN_MIGRATIONS
        value: "true" # alembic upgrade head on every start
      - key: SCHEDULER_ENABLED
        value: "true" # exactly one instance runs the scheduler
      - key: SCHEDULER_CRON_HOUR
        value: "6"
      - key: STORAGE_BACKEND
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: bill-maker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://bill-maker-web.onrender.com
      - key: CORS_ORIGINS
        value: https://bill-maker-web.onrender.com
      # Email (Resend). Without these, bills can be created but not emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false # an address on a domain verified in Resend
      # Payments (Dodo). Use TEST-mode credentials for user testing.
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------- Web (React + Vite)
  - type: web
    name: bill-maker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://bill-maker-api.onrender.com
    routes:
      # Single-page app: every path is served by index.html (/pay/:token, /bills/12, ...).
      - type: rewrite
        source: /*
        destination: /index.html
